[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archival-htr"
version = "0.1.0"
description = "Historical document HTR pipeline — Gemini Vision or local Ollama + ChromaDB RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.7.0",
    "Pillow>=10.0.0",
]

[project.scripts]
archival-htr = "archival_htr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archival_htr"]

services:
  - type: web
    name: archival-htr
    runtime: docker
    dockerBuildArgs:
      EXTRAS: gemini
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 2
    envVars:
      - key: BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: INGEST_KEY
        sync: false
      - key: DATA_INPUT_DIR
        value: /app/data/input
      - key: DATA_OUTPUT_DIR
        value: /app/data/output
      - key: CHROMA_DIR
        value: /app/data/chroma

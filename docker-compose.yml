services:
  archival-htr:
    build:
      context: .
      args:
        EXTRAS: gemini
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATA_INPUT_DIR: /data/input
      DATA_OUTPUT_DIR: /data/output
      CHROMA_DIR: /data/chroma
      # Container-side override: reach the host's Ollama from inside Docker Desktop (Win/Mac).
      # On Linux, replace with http://172.17.0.1:11434 or use network_mode: host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
      - chroma_store:/data/chroma
      # Dev: mount source so code changes apply without rebuild (restart container to reload)
      - ./src:/app/src
    # Override CMD at runtime, e.g:
    # docker compose run archival-htr search "battle of hastings"

volumes:
  chroma_store:
